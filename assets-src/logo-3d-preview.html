<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayProof 3D logo opening: preview</title>
<style>
  :root{--ink:#0D1330;--navy:#1E2A5E;--amber:#FFC233;--paper:#E8ECFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--ink);display:grid;place-items:center;font-family:"Helvetica Neue",Arial,sans-serif;color:#fff}
  .stage{width:min(94vw,440px);background:var(--navy);border:3px solid #fff;box-shadow:8px 8px 0 #000;padding:8px 8px 4px}
  svg{display:block;width:100%;height:auto}
  .bar{display:flex;gap:12px;justify-content:center;margin:20px 0 4px}
  button{font:inherit;font-weight:800;padding:12px 18px;min-height:44px;background:var(--amber);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
  button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  p.note{font-size:13px;color:#C9D1FF;text-align:center;max-width:420px;margin:8px auto 0;line-height:1.4}
  .wrap{padding:20px 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="s" viewBox="0 -60 420 500" role="img" aria-label="PayProof logo opening animation">
      <g id="scene"></g>
      <g id="coin" opacity="0">
        <circle r="17" fill="#FFC233" stroke="#0D1330" stroke-width="3"/>
        <text y="7" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#0D1330">₹</text>
      </g>
      <g id="word">
        <text x="214" y="394" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="46" letter-spacing="-2" fill="#0D1330">PayProof</text>
        <text x="210" y="390" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="46" letter-spacing="-2" fill="#fff">PayProof</text>
      </g>
      <text id="tag" x="210" y="420" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="14" fill="#D4DAFF">Know what you really earn.</text>
    </svg>
  </div>
  <div class="bar"><button id="replay" type="button">Replay</button></div>
  <p class="note">About 2 seconds. Plain SVG and JavaScript: no libraries, no WebGL. In the app it plays once per session, can be skipped with a tap, and is skipped completely when the phone's "reduce motion" setting is on.</p>
</div>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg", S=0.866, OX=142, OY=262;
  var INK="#0D1330", HB=17, GAP=52, HEIGHTS=[44,78,112,150];
  function P(x,y,z){return [OX+(x-y)*S, OY+(x+y)*0.5-z];}
  function pts(a){return a.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");}
  function el(n,a,parent){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(parent||scene).appendChild(e);return e;}
  var scene=document.getElementById("scene");

  // base plate with hard shadow
  var plate=el("g",{});
  var T=10, px0=-30, px1=30, py0=-190, py1=34;
  function plateFace(z){return [P(px0,py0,z),P(px1,py0,z),P(px1,py1,z),P(px0,py1,z)];}
  var top=plateFace(0), bot=plateFace(-T);
  el("polygon",{points:pts(bot.map(function(p){return [p[0]+10,p[1]+10];})),fill:INK},plate);
  el("polygon",{points:pts([top[2],top[3],bot[3],bot[2]]),fill:"#8793D6",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"},plate);
  el("polygon",{points:pts([top[1],top[2],bot[2],bot[1]]),fill:"#AEB8EA",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"},plate);
  el("polygon",{points:pts(top),fill:"#E8ECFF",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"},plate);

  // bars, far to near
  var bars=[];
  for(var i=3;i>=0;i--){
    var g=el("g",{});
    bars[i]={
      left:el("polygon",{fill:"#00A693",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"},g),
      right:el("polygon",{fill:"#007F70",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"},g),
      top:el("polygon",{fill:"#2FD5BF",stroke:INK,"stroke-width":3,"stroke-linejoin":"round"},g),
      y:-GAP*i
    };
  }
  function drawBar(i,h){
    var b=bars[i],y=b.y,a=HB;
    var vis=h>0.5; b.left.style.display=b.right.style.display=b.top.style.display=vis?"":"none";
    if(!vis)return;
    b.left.setAttribute("points",pts([P(-a,y+a,0),P(a,y+a,0),P(a,y+a,h),P(-a,y+a,h)]));
    b.right.setAttribute("points",pts([P(a,y-a,0),P(a,y+a,0),P(a,y+a,h),P(a,y-a,h)]));
    b.top.setAttribute("points",pts([P(-a,y-a,h),P(a,y-a,h),P(a,y+a,h),P(-a,y+a,h)]));
  }

  // easing
  function clamp(p){return Math.max(0,Math.min(1,p));}
  function outCubic(p){return 1-Math.pow(1-p,3);}
  function outBack(p){var c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);}
  function outBounce(p){var n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d){p-=1.5/d;return n*p*p+0.75;}if(p<2.5/d){p-=2.25/d;return n*p*p+0.9375;}p-=2.625/d;return n*p*p+0.984375;}

  var coin=document.getElementById("coin"), word=document.getElementById("word"), tag=document.getElementById("tag");
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var END=2.1;

  function render(t){
    // plate drops in (0 to 0.4 s)
    var pp=outCubic(clamp(t/0.4));
    plate.setAttribute("transform","translate(0,"+(-46*(1-pp)).toFixed(1)+")");
    plate.setAttribute("opacity",pp.toFixed(2));
    // bars extrude one after another
    for(var i=0;i<4;i++){
      var p=clamp((t-(0.32+0.14*i))/0.55);
      drawBar(i,HEIGHTS[i]*outBack(p));
    }
    // coin falls onto the tallest bar and bounces
    var cp=clamp((t-1.0)/0.7);
    var zRest=HEIGHTS[3]+17, z=zRest+150*(1-outBounce(cp));
    var c=P(0,bars[3].y,z);
    var sx=Math.max(0.12,Math.abs(Math.cos((1-cp)*Math.PI*5)));
    coin.setAttribute("transform","translate("+c[0].toFixed(1)+","+c[1].toFixed(1)+") scale("+sx.toFixed(3)+",1)");
    coin.setAttribute("opacity",clamp(cp*8).toFixed(2));
    // wordmark and tagline
    var wp=outCubic(clamp((t-1.35)/0.45));
    word.setAttribute("transform","translate(0,"+(16*(1-wp)).toFixed(1)+")");
    word.setAttribute("opacity",wp.toFixed(2));
    tag.setAttribute("opacity",clamp((t-1.65)/0.35).toFixed(2));
  }
  window.seek=render;

  var raf=0;
  function play(){
    cancelAnimationFrame(raf);
    if(reduce){render(END);return;}
    var t0=performance.now();
    (function tick(now){var t=(now-t0)/1000;render(Math.min(t,END));if(t<END)raf=requestAnimationFrame(tick);})(t0);
  }
  document.getElementById("replay").addEventListener("click",play);
  render(0);play();
})();
</script>
</body>
</html>
