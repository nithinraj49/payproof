<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayProof</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="stage">
      <svg class="bars-svg" id="splash-svg" viewBox="0 -60 420 500" role="img" aria-label="">
        <g class="bars-scene"></g>
        <g class="bars-coin" opacity="0">
          <circle r="17" fill="#FFC233" stroke="#0D1330" stroke-width="3"/>
          <text y="7" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#0D1330">&#8377;</text>
        </g>
        <g class="bars-word">
          <text x="214" y="394" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="46" letter-spacing="-2" fill="#0D1330">PayProof</text>
          <text x="210" y="390" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="46" letter-spacing="-2" fill="#fff">PayProof</text>
        </g>
        <text class="bars-tag" x="210" y="420" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="14" fill="#D4DAFF">Know what you really earn.</text>
      </svg>
    </div>
  </div>

  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 1024 1024" role="img" aria-label="PayProof logo" width="40" height="40">
        <rect width="1024" height="1024" rx="224" fill="#14203C"/>
        <rect class="brand-bar brand-bar-1" x="230" y="560" width="110" height="240" rx="30" fill="#00A896"/>
        <rect class="brand-bar brand-bar-2" x="400" y="470" width="110" height="330" rx="30" fill="#00A896"/>
        <rect class="brand-bar brand-bar-3" x="570" y="360" width="110" height="440" rx="30" fill="#00A896"/>
        <rect class="brand-bar brand-bar-4" x="740" y="250" width="110" height="550" rx="30" fill="#00A896"/>
        <rect x="200" y="830" width="680" height="30" rx="15" fill="#EAF0FF"/>
      </svg>
      <h1>PayProof</h1>
    </div>
    <p id="auth-status" class="auth-status">Signing in&hellip;</p>
  </header>

  <div id="step-indicator" class="step-indicator" hidden>
    <div class="step-dot" id="step-dot-1"><span class="step-dot-num">1</span><span class="step-dot-label" id="step-label-1"></span></div>
    <div class="step-line" id="step-line-1"><span class="step-line-fill"></span></div>
    <div class="step-dot" id="step-dot-2"><span class="step-dot-num">2</span><span class="step-dot-label" id="step-label-2"></span></div>
    <div class="step-line" id="step-line-2"><span class="step-line-fill"></span></div>
    <div class="step-dot" id="step-dot-3"><span class="step-dot-num">3</span><span class="step-dot-label" id="step-label-3"></span></div>
    <div class="step-line" id="step-line-3"><span class="step-line-fill"></span></div>
    <div class="step-dot" id="step-dot-4"><span class="step-dot-num">4</span><span class="step-dot-label" id="step-label-4"></span></div>
  </div>

  <nav id="app-nav" class="app-nav" hidden>
    <button id="nav-results" type="button" class="small"></button>
    <button id="nav-ask" type="button" class="small"></button>
    <button id="nav-evidence" type="button" class="small"></button>
  </nav>

  <main id="app">
    <!-- Screen a: landing -->
    <section id="screen-landing" class="screen" hidden>
      <div class="landing-hero">
        <svg class="bars-svg" id="landing-hero-svg" viewBox="0 -60 420 500" role="img" aria-hidden="true">
          <g class="bars-scene"></g>
          <g class="bars-coin" opacity="0">
            <circle r="17" fill="#FFC233" stroke="#0D1330" stroke-width="3"/>
            <text y="7" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#0D1330">&#8377;</text>
          </g>
        </svg>
        <p id="landing-headline" class="landing-headline"></p>
        <p id="landing-tagline" class="landing-subhead"></p>
      </div>
      <button id="btn-try-sample" class="primary" type="button"></button>
      <div id="sample-picker" hidden>
        <p id="sample-simulated-note" class="banner"></p>
        <div id="sample-cards"></div>
      </div>
      <label class="upload-btn" for="file-input"><span id="upload-heading"></span></label>
      <input id="file-input" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp" multiple />
      <ul class="how-it-works">
        <li data-step="1" id="how-it-works-1"></li>
        <li data-step="2" id="how-it-works-2"></li>
        <li data-step="3" id="how-it-works-3"></li>
      </ul>
      <p id="landing-privacy" class="privacy-note"></p>
    </section>

    <!-- Screen b: review -->
    <section id="screen-review" class="screen" hidden>
      <h2 id="review-title"></h2>
      <div id="review-rejected-in-batch" hidden>
        <p id="review-rejected-in-batch-label"></p>
        <ul id="review-rejected-list" class="rejected-list"></ul>
      </div>
      <div id="review-groups"></div>
      <button id="btn-review-continue" class="primary" type="button" disabled></button>
      <p id="review-continue-hint" class="hint" hidden></p>
    </section>

    <!-- Screen c: rejected -->
    <section id="screen-rejected" class="screen" hidden>
      <h2 id="rejected-title"></h2>
      <p id="rejected-reason"></p>
      <button id="btn-try-another" class="primary" type="button"></button>
    </section>

    <!-- Screen d: costs -->
    <section id="screen-costs" class="screen" hidden>
      <h2 id="costs-title"></h2>
      <div class="field">
        <label id="label-fuel" for="input-fuel"></label>
        <input id="input-fuel" type="number" min="0" step="0.01" inputmode="decimal" />
      </div>
      <div class="field">
        <label id="label-maintenance" for="input-maintenance"></label>
        <input id="input-maintenance" type="number" min="0" step="0.01" inputmode="decimal" />
      </div>
      <div class="field">
        <label id="label-fixed-daily" for="input-fixed-daily"></label>
        <input id="input-fixed-daily" type="number" min="0" step="0.01" inputmode="decimal" />
        <p id="hint-fixed-daily" class="hint"></p>
      </div>
      <div class="field" id="field-hours-online">
        <label id="label-hours-online" for="input-hours-online"></label>
        <input id="input-hours-online" type="number" min="0" step="0.01" inputmode="decimal" />
        <p id="hint-hours-online" class="hint"></p>
      </div>
      <button id="btn-save-costs" class="primary" type="button"></button>
      <p id="costs-saved-note" class="hint" hidden></p>
    </section>

    <!-- Screen e: results -->
    <section id="screen-results" class="screen" hidden>
      <h2 id="results-title"></h2>
      <div id="results-body"></div>
    </section>

    <!-- Screen f: ask -->
    <section id="screen-ask" class="screen" hidden>
      <h2 id="ask-title"></h2>
      <div id="ask-suggestions"></div>
      <div class="field">
        <label id="label-ask-question" for="input-ask-question"></label>
        <textarea id="input-ask-question" rows="3" maxlength="500"></textarea>
      </div>
      <button id="btn-ask-submit" class="primary" type="button"></button>
      <div id="ask-answer" class="card" hidden>
        <p id="ask-verified-badge" class="verified-badge" hidden></p>
        <p id="ask-answer-text"></p>
      </div>
    </section>

    <!-- Screen g: evidence pack and delete -->
    <section id="screen-evidence" class="screen" hidden>
      <h2 id="evidence-title"></h2>
      <div class="card">
        <button id="btn-open-report" class="secondary" type="button"></button>
        <p id="evidence-privacy-note" class="privacy-note"></p>
      </div>
      <div class="card">
        <h3 id="delete-heading"></h3>
        <p id="delete-explain"></p>
        <button id="btn-delete-data" class="secondary" type="button"></button>
        <div id="delete-confirm-panel" hidden>
          <p id="delete-confirm-text" class="error-banner"></p>
          <button id="btn-delete-confirm-yes" class="primary" type="button"></button>
          <button id="btn-delete-confirm-cancel" class="secondary" type="button"></button>
        </div>
      </div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="Your uploaded screenshot, enlarged" />
  </div>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <span id="loading-text"></span>
  </div>
  <div id="toast" class="toast" role="alert" hidden></div>
  <div id="error-line" class="error-line" role="alert" hidden></div>

  <footer id="version-stamp" class="version-stamp"></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { initApp, initSplash } from "./app.js";
    import { STRINGS } from "./strings.js";
    import { VERSION } from "./version.js";

    // Runs immediately, independent of sign-in -- never delays or blocks it.
    initSplash();

    const statusEl = document.getElementById("auth-status");
    statusEl.textContent = STRINGS.app.signingIn;
    document.getElementById("version-stamp").textContent = `Build ${VERSION.buildDate} · ${VERSION.shortId}`;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let started = false;
    onAuthStateChanged(auth, (user) => {
      if (!user || started) {
        return;
      }
      started = true;
      statusEl.hidden = true;
      initApp();
    });

    signInAnonymously(auth).catch((err) => {
      statusEl.textContent = STRINGS.app.signInFailed;
      console.error(err);
    });
  </script>
</body>
</html>
