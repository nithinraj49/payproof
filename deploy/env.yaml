# Non-secret Cloud Run environment variables for the "payproof" service.
# Everything in this file is safe to commit: project id, region, model names
# and numeric limits only. No API keys, no credentials. GEMINI_API_KEY is
# never set on Cloud Run (Vertex AI uses the service account instead).
#
# Used with: gcloud run deploy payproof --env-vars-file=deploy/env.yaml ...
# --env-vars-file REPLACES all existing environment variables on the service.
PROJECT_ID: "payproof-nithin-2026"
REGION: "asia-south1"
VERTEX_LOCATION: "global"
GEMINI_BACKEND: "vertex"
EXTRACTION_MODEL: "gemini-3.1-flash-lite"
EXPLAIN_MODEL: "gemini-3.1-flash-lite"
IMAGE_MAX_SIDE_PX: "1280"
IMAGE_JPEG_QUALITY: "85"
MAX_UPLOAD_MB: "8"
EXTRACTION_MAX_OUTPUT_TOKENS: "1500"
ANSWER_MAX_OUTPUT_TOKENS: "400"
GEMINI_TIMEOUT_SECONDS: "30"
LIMIT_EXTRACTIONS_PER_USER_PER_DAY: "12"
LIMIT_QUESTIONS_PER_USER_PER_DAY: "25"
LIMIT_GLOBAL_GEMINI_CALLS_PER_DAY: "400"
